[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dummy-fastapi"
version = "1.0.0"
description = "A minimal FastAPI application"
authors = [
    {name = "Riabchenko Aleksandr", email = "ra@topor.tech"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
]

[project.scripts]
dummy-fastapi = "dummy_fastapi.app:main"

[tool.hatch.build.targets.wheel]
packages = ["dummy_fastapi"] 